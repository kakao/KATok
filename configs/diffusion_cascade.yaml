# Cascaded generation -- the paper's default strategy.
#
# A lightweight mask prior generates the token layout, then the SiT-XL content model
# is conditioned on the selected positions. Released model is class-conditional on
# UCF-101, trained at 256^2 x 16 on KATok latents.

name: katok-diffusion-cascade
variant: cascaded

model:
  input_dim: 64            # KATok latent channels
  hidden_size: 1152        # SiT-XL
  depth: 28
  num_heads: 16
  mlp_ratio: 4.0
  class_dropout_prob: 0.1
  num_classes: 101         # UCF-101; index 101 is the unconditional slot
  max_tokens: 8192
  embed_token_len: true    # token-count conditioning, the controllability handle
  token_len_dropout_prob: 0.1
  sinusoidal_1d_pos_embed: false
  predict_pos: false
  use_position_prior: true
  qk_norm: true

  # Mask prior (8.3M): a small SiT over the occupancy grid.
  prior_hidden_size: 192
  prior_depth: 12
  prior_num_heads: 3
  prior_n_reg: 2
  prior_grid: [2, 16, 16]  # matches the tokenizer's patch grid at 256^2 x 16
  prior_qk_norm: true

sampling:
  n_registers: 2
  patch_grid: [2, 16, 16]  # encoder patch grid handed to the tokenizer decoder
  cfg_scale: 4.0
  num_steps: 50
